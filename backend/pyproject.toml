[project]
name = "sqc-dashboard-backend"
version = "1.0.0"
description = "Standalone statistical quality control API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18.4,<2",
  "asyncpg>=0.31,<1",
  "fastapi>=0.136.1,<1",
  "numpy>=2.5.1,<3",
  "openpyxl>=3.1.5,<4",
  "pydantic-settings>=2.15,<3",
  "python-multipart>=0.0.22,<1",
  "scipy>=1.18,<2",
  "sqlalchemy[asyncio]>=2.0.49,<3",
  "structlog>=25.5,<26",
  "uvicorn[standard]>=0.41,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "pyright>=1.1.407,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions/.source_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["I001"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["app", "scripts", "tests"]
exclude = ["alembic/versions/.source_*.py"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "postgres: requires the dedicated PostgreSQL test database",
]
filterwarnings = ["error"]
