name: sqc-dashboard-tcc

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://sqc:local_only@db:5432/sqc
  STORAGE_ROOT: /data/storage
  ENVIRONMENT: demo

x-backend-image: &backend-image
  build:
    context: ./backend
  image: sqc-dashboard-tcc-backend:local

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sqc
      POSTGRES_USER: sqc
      POSTGRES_PASSWORD: local_only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqc -d sqc"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks: [internal]

  migrate:
    <<: *backend-image
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    volumes:
      - app-storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  seed:
    <<: *backend-image
    command: ["python", "-m", "app.seed"]
    environment:
      <<: *app-environment
      SEED_PROFILE: synthetic-demo
    volumes:
      - app-storage:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks: [internal]

  backend:
    <<: *backend-image
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-environment
    volumes:
      - app-storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks: [internal]

  frontend:
    build:
      context: ./frontend
    image: sqc-dashboard-tcc-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1:8080/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal
      - edge

volumes:
  postgres-data:
  app-storage:

networks:
  internal:
    internal: true
  edge:
